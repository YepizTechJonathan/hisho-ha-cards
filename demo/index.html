<!doctype html><html><head><meta charset="utf-8"><title>Hisho cards demo</title>
<style>
  :root { --primary-color:#03a9f4; --primary-text-color:#212121; --secondary-text-color:#727272; --divider-color:#e0e0e0;
    --card-background-color:#fff; --secondary-background-color:#f2f2f2; --success-color:#43a047; --warning-color:#ffa600;
    --error-color:#db4437; --disabled-text-color:#bdbdbd; --ha-card-border-radius:12px; }
  body.dark { --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --divider-color:#3a3a3a;
    --card-background-color:#1c1c1c; --secondary-background-color:#2a2a2a; background:#111; }
  body { font-family: Roboto, system-ui, sans-serif; background:#f0f0f0; margin:16px; }
  ha-card { display:block; background:var(--card-background-color); border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,.12); }
  body.dark { background: linear-gradient(rgba(6, 10, 7, 0.22), rgba(6, 10, 7, 0.5)), url("forest.jpg") center / cover no-repeat fixed, #0a110d; }
  #grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap:16px; align-items:start; }
</style></head><body class="dark"><div id="grid"></div>
<script>
  // Home Assistant provides <ha-card>; this stand-in gives the demo the same frame.
  customElements.define("ha-card", class extends HTMLElement {
    constructor() { super(); const r = this.attachShadow({mode: "open"});
      r.innerHTML = `<style>:host{display:block;background:var(--ha-card-background,var(--card-background-color));border-radius:12px;
        box-shadow:0 2px 6px rgba(0,0,0,.14);color:var(--primary-text-color)}</style><slot></slot>`; }
  });
</script><script type="module" src="demo.js"></script></body></html>
