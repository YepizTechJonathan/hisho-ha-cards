# Runs on Forgejo (Kihon), on Hashira Ren, woken if parked: Kihon copies every push from GitHub to
# hisho/hisho-ha-cards every few minutes (hisho deploy/forgejo/ha_repos.py). GitHub runs no Actions here.
# HACS installs dist/hisho-ha-cards.js from the tagged commit, so no release asset is uploaded;
# the last step keeps that file honest.
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ren
    container:
      image: node:22-trixie
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ matches the source
        run: git diff --exit-code -- dist/hisho-ha-cards.js
